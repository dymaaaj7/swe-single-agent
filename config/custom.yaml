# Custom template adapted from the requested format
# This template uses SWE-agent's tool system (str_replace_editor, filemap, search, etc.)
agent:
  model:
    name: "openrouter/moonshotai/kimi-k2.5"
    api_key: "$OPENROUTER_API_KEY"  # $ means "read from this env var"
    per_instance_cost_limit: 0  # Disable cost tracking
    total_cost_limit: 0         # Disable cost tracking
  templates:
    system_template: |-
      You are a helpful assistant that can interact with a computer.
    instance_template: |-
      Please solve this issue: {{problem_statement}}

      You can execute bash commands and edit files to implement the necessary changes.

      ## Recommended Workflow

      This workflows should be done step-by-step so that you can iterate on your changes and any possible problems.

      1. Analyze the codebase by finding and reading relevant files
      2. Create a script to reproduce the issue
      3. Edit the source code to resolve the issue
      4. Verify your fix works by running your script again
      5. Test edge cases to ensure your fix is robust
      6. Submit your changes and finish your work by issuing the submit command.
         Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

      ## Command Execution Rules

      You are operating in an environment where

      1. You issue at least one command
      2. The system executes the command(s) in a subshell
      3. You see the result(s)
      4. You write your next command(s)

      Each response should include:

      1. **Reasoning text** where you explain your analysis and plan
      2. At least one tool call with your command

      **CRITICAL REQUIREMENTS:**

      - Your response SHOULD include reasoning text explaining what you're doing
      - Your response MUST include AT LEAST ONE tool call (bash command, str_replace_editor, search_dir, find_file, filemap, etc.)
      - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
      - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files
      - Submit your changes and finish your work by issuing the submit command.
        Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

      ## Available Tools

      You have access to the following tools:
      - `str_replace_editor` - Custom editing tool for viewing, creating and editing files
      - `filemap` - Print the contents of a Python file, skipping lengthy function and method definitions
      - `search_dir` - Search for a term in all files in a directory
      - `search_file` - Search for a term in a specific file
      - `find_file` - Find files with a given name or pattern
      - `submit` - Submit your solution when you're done
      - `bash` - Execute bash commands (enabled by default)
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
      - path: tools/search
      - path: tools/filemap
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this issue. Please carefully follow the steps below to help review your changes.

          1. If you made any changes to your code after running the reproduction script, please run the reproduction script again.
            If the reproduction script is failing, please revisit your changes and make sure they are correct.
            If you have already removed your reproduction script, please ignore this step.
          2. Remove your reproduction script (if you haven't done so already).
          3. If you have modified any TEST files, please revert them to the state they had before you started fixing the issue.
            You can do this with `git checkout -- /path/to/test/file.py`. Use below <diff> to find the files you need to revert.
          4. Run the submit command again to confirm.

          Here is a list of all of your changes:

          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: cache_control
      last_n_messages: 2
